<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Manual Order Console</title>
  <style>
    :root {
      --bg: #f3f6fb;
      --card: #ffffff;
      --line: #d9e2ef;
      --text: #0f172a;
      --muted: #64748b;
      --brand: #1d4ed8;
      --brand-dark: #123a94;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .wrap { max-width: 980px; margin: 0 auto; padding: 16px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 6px 24px rgba(15, 23, 42, 0.05);
      padding: 16px;
      margin-bottom: 12px;
    }
    h1 { margin: 0 0 6px; color: #0b2a50; font-size: 22px; }
    .muted { color: var(--muted); font-size: 13px; line-height: 1.6; }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-top: 12px;
    }
    @media (max-width: 860px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    .field label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .field input, .field select {
      width: 100%;
      height: 40px;
      border-radius: 10px;
      border: 1px solid var(--line);
      padding: 0 10px;
      font-size: 14px;
      background: #fff;
      color: var(--text);
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
      align-items: center;
    }
    button {
      height: 40px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #fff;
      color: #0b2a50;
      padding: 0 14px;
      font-size: 14px;
      cursor: pointer;
    }
    button.primary {
      background: var(--brand);
      border-color: var(--brand);
      color: #fff;
      font-weight: 600;
    }
    button.primary:hover {
      background: var(--brand-dark);
      border-color: var(--brand-dark);
    }
    .output {
      margin-top: 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
      background: #f8fbff;
      white-space: pre-wrap;
      line-height: 1.6;
      font-size: 14px;
      word-break: break-word;
    }
    .quick-link a { color: var(--brand); text-decoration: none; font-weight: 600; }
    .quick-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Manual Order Console</h1>
      <div class="muted">
        For customer support only. Create missing order first, then create payment URL.
        After payment, verify in <code>/support-orders.html</code>.
      </div>

      <div class="row">
        <input id="adminTokenInput" type="password" style="min-width:280px;flex:1;" placeholder="ADMIN_DASHBOARD_TOKEN" />
        <button class="primary" id="saveAdminTokenBtn">Save Token (Session)</button>
      </div>

      <div class="grid">
        <div class="field"><label>Year</label><input id="year" type="number" value="1988" /></div>
        <div class="field"><label>Month</label><input id="month" type="number" min="1" max="12" value="8" /></div>
        <div class="field"><label>Day</label><input id="day" type="number" min="1" max="31" value="21" /></div>
        <div class="field"><label>Hour (0-23)</label><input id="hour" type="number" min="0" max="23" value="15" /></div>
        <div class="field">
          <label>Gender</label>
          <select id="gender">
            <option value="male" selected>male</option>
            <option value="female">female</option>
          </select>
        </div>
        <div class="field"><label>Birthplace (optional)</label><input id="birthplace" type="text" placeholder="e.g. Beijing" /></div>
        <div class="field">
          <label>Tier</label>
          <select id="tier">
            <option value="basic">basic (0.01)</option>
            <option value="pro">pro (0.01)</option>
            <option value="vip">vip (0.01)</option>
          </select>
        </div>
        <div class="field"><label>Custom Trade No (optional)</label><input id="tradeNoInput" type="text" placeholder="auto if empty" /></div>
      </div>

      <div class="row">
        <button class="primary" id="createOrderBtn">1) Create Order</button>
        <button class="primary" id="createPayBtn">2) Create Payment URL</button>
        <button id="copyTradeBtn">Copy Trade No</button>
        <button id="copyPayBtn">Copy Payment URL</button>
      </div>

      <div id="resultBox" class="output">Save admin token first.</div>
      <div class="quick-link" style="margin-top:8px;">
        <a id="resultLink" href="#" target="_blank" rel="noopener">Open Result Page</a>
      </div>
    </div>
  </div>

  <script src="js/bazi.js"></script>
  <script>
    const SUPABASE_URL = 'https://rcyssrsnalefzhzsvswm.supabase.co';
    const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJjeXNzcnNuYWxlZnpoenN2c3dtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI4NTM5NjksImV4cCI6MjA4ODQyOTk2OX0.AiRGSCEYBGWZQgLXjghwjsESKBGSq7a0Z7NBLfrzuWU';
    const ADMIN_TOOL_URL = `${SUPABASE_URL}/functions/v1/admin-orders`;
    const ADMIN_TOKEN_KEY = 'bazi_support_admin_token';
    const PAYMENT_OPTIONS = {
      basic: { id: 'basic', title: 'basic', fee: '0.01' },
      pro: { id: 'pro', title: 'pro', fee: '0.01' },
      vip: { id: 'vip', title: 'vip', fee: '0.01' },
    };

    const resultBox = document.getElementById('resultBox');
    const resultLink = document.getElementById('resultLink');
    const tradeNoInput = document.getElementById('tradeNoInput');
    const adminTokenInput = document.getElementById('adminTokenInput');
    const saveAdminTokenBtn = document.getElementById('saveAdminTokenBtn');

    let currentTradeNo = '';
    let currentPayUrl = '';

    function setResult(msg) {
      resultBox.textContent = msg;
    }

    function getAdminToken() {
      return String(sessionStorage.getItem(ADMIN_TOKEN_KEY) || '').trim();
    }

    function setAdminToken(value) {
      sessionStorage.setItem(ADMIN_TOKEN_KEY, String(value || '').trim());
    }

    function validateTradeNo(value) {
      return /^bazi-[a-z0-9_-]{4,120}$/i.test(String(value || '').trim());
    }

    async function callAdmin(action, payload = {}) {
      const token = getAdminToken();
      if (!token) throw new Error('Missing admin token. Save token first.');

      const res = await fetch(ADMIN_TOOL_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          Authorization: `Bearer ${SUPABASE_ANON}`,
          'x-admin-token': token,
        },
        body: JSON.stringify({ action, ...payload }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || data?.error) {
        const details = typeof data?.details === 'string' ? `: ${data.details}` : '';
        throw new Error(data?.error ? `${data.error}${details}` : `HTTP ${res.status}`);
      }
      return data;
    }

    function genTradeNo() {
      const rand = Math.random().toString(36).slice(2, 8);
      return `bazi-manual-${Date.now()}-${rand}`;
    }

    function buildGenderForCalc(gender) {
      return gender === 'female' ? '\u5973' : '\u7537';
    }

    function getForm() {
      const year = Number(document.getElementById('year').value);
      const month = Number(document.getElementById('month').value);
      const day = Number(document.getElementById('day').value);
      const hour = Number(document.getElementById('hour').value);
      const gender = String(document.getElementById('gender').value || 'male');
      const birthplace = String(document.getElementById('birthplace').value || '').trim();
      const tier = String(document.getElementById('tier').value || 'basic');

      if (!year || !month || !day || Number.isNaN(hour) || hour < 0 || hour > 23) {
        throw new Error('Invalid birth date/time.');
      }
      if (!['male', 'female'].includes(gender)) {
        throw new Error('Invalid gender value.');
      }

      const bazi = window.BaziCalc.calculateBazi(year, month, day, hour);
      const genderForCalc = buildGenderForCalc(gender);
      const daYunData = window.BaziCalc.calculateDaYun(bazi.year, bazi.month, genderForCalc, year, month, day);
      const currentYear = new Date().getFullYear();
      const lastDayun = daYunData.dayuns[daYunData.dayuns.length - 1];
      const lifeEndYear = year + lastDayun.ageStart + 10;
      const lifeStartYear = year + daYunData.startAge;
      const specialYears = window.BaziCalc.calcSpecialYears(bazi, daYunData.dayuns, year, lifeStartYear, lifeEndYear);

      const baziStr = `${bazi.year.tg}${bazi.year.dz} / ${bazi.month.tg}${bazi.month.dz} / ${bazi.day.tg}${bazi.day.dz} / ${bazi.hour.tg}${bazi.hour.dz}`;
      const dayunText = daYunData.dayuns.map((d) => `${d.gz} (${d.ageStart} age, ${d.yearStart} year)`).join(' | ');
      const specialText = specialYears.length
        ? specialYears.map((s) => {
            const phase = s.year < currentYear ? 'past' : (s.year === currentYear ? 'current' : 'future');
            return `${s.year} ${s.gz} [${phase}] ${s.reasons.join('; ')}`;
          }).join('\n')
        : 'No major clash years detected.';

      return {
        year,
        month,
        day,
        hour,
        gender,
        gender_for_calc: genderForCalc,
        birthplace,
        tier,
        bazi_str: baziStr,
        dayun_text: dayunText,
        special_years_text: specialText,
        start_age: daYunData.startAge,
        option: PAYMENT_OPTIONS[tier] || PAYMENT_OPTIONS.basic,
      };
    }

    function updateResultLink(tradeNo) {
      const href = `https://tengyunzi.com/result.html?trade_no=${encodeURIComponent(tradeNo)}&paid=true`;
      resultLink.href = href;
      resultLink.textContent = `Open Result Page: ${href}`;
    }

    async function createOrder() {
      const form = getForm();
      const customTradeNo = String(tradeNoInput.value || '').trim();
      const tradeNo = customTradeNo || genTradeNo();
      if (!validateTradeNo(tradeNo)) throw new Error('Invalid trade_no format.');

      const birthInput = {
        year: form.year,
        month: form.month,
        day: form.day,
        hour: form.hour,
        gender: form.gender_for_calc,
        birthplace: form.birthplace,
        bazi_str: form.bazi_str,
        dayun_text: form.dayun_text,
        special_years_text: form.special_years_text,
        start_age: form.start_age,
        payment_option: form.option,
      };

      await callAdmin('create_order', {
        trade_no: tradeNo,
        birth_input: birthInput,
      });

      currentTradeNo = tradeNo;
      tradeNoInput.value = tradeNo;
      updateResultLink(tradeNo);
      setResult(
        `Order created\n` +
        `Trade no: ${tradeNo}\n` +
        `Tier: ${form.option.id} / Fee: CNY ${form.option.fee}\n` +
        `Bazi: ${form.bazi_str}\n\n` +
        `Next: click 2) Create Payment URL.`
      );
    }

    async function createPaymentUrl() {
      const tradeNo = String(tradeNoInput.value || currentTradeNo || '').trim();
      if (!validateTradeNo(tradeNo)) throw new Error('Invalid trade_no format.');
      const tier = String(document.getElementById('tier').value || 'basic');
      const option = PAYMENT_OPTIONS[tier] || PAYMENT_OPTIONS.basic;

      const data = await callAdmin('create_payment', {
        trade_no: tradeNo,
        payment_option_id: option.id,
        client_env: {
          user_agent: navigator.userAgent || '',
          is_mobile: /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || ''),
          is_wechat: /MicroMessenger/i.test(navigator.userAgent || ''),
        },
      });

      currentPayUrl = data.url || data.url_qrcode || '';
      if (!currentPayUrl) throw new Error('No payment URL returned.');

      setResult(
        `Payment URL created\n` +
        `Trade no: ${tradeNo}\n` +
        `Tier: ${option.id} / Fee: CNY ${option.fee}\n` +
        `URL: ${currentPayUrl}\n\n` +
        `After payment, verify in /support-orders.html`
      );
    }

    saveAdminTokenBtn.addEventListener('click', () => {
      const token = String(adminTokenInput.value || '').trim();
      if (!token) {
        setResult('Input admin token first.');
        return;
      }
      setAdminToken(token);
      setResult('Admin token saved in this tab session.');
    });

    document.getElementById('createOrderBtn').addEventListener('click', async () => {
      try {
        setResult('Creating order...');
        await createOrder();
      } catch (err) {
        setResult(`Create failed: ${err instanceof Error ? err.message : String(err)}`);
      }
    });

    document.getElementById('createPayBtn').addEventListener('click', async () => {
      try {
        setResult('Creating payment URL...');
        await createPaymentUrl();
      } catch (err) {
        setResult(`Create URL failed: ${err instanceof Error ? err.message : String(err)}`);
      }
    });

    document.getElementById('copyTradeBtn').addEventListener('click', async () => {
      const value = String(tradeNoInput.value || currentTradeNo || '').trim();
      if (!value) {
        setResult('No trade no to copy.');
        return;
      }
      try {
        await navigator.clipboard.writeText(value);
        setResult(`Copied trade no: ${value}`);
      } catch {
        setResult('Copy trade no failed.');
      }
    });

    document.getElementById('copyPayBtn').addEventListener('click', async () => {
      if (!currentPayUrl) {
        setResult('No payment URL to copy.');
        return;
      }
      try {
        await navigator.clipboard.writeText(currentPayUrl);
        setResult(`Copied payment URL:\n${currentPayUrl}`);
      } catch {
        setResult(`Copy payment URL failed:\n${currentPayUrl}`);
      }
    });

    (() => {
      const token = getAdminToken();
      if (token) adminTokenInput.value = token;
      setResult(token ? 'Token found. You can create orders now.' : 'Save admin token first.');
    })();
  </script>
</body>
</html>
