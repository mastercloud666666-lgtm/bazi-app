<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>八字排盘结果</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="container">
    <header>
      <nav class="nav-bar">
        <a href="index.html" class="active">八字</a>
        <a href="qiming.html">起名</a>
        <a href="zhanbu.html">占卜</a>
        <a href="fengshui.html">风水</a>
      </nav>
      <a href="index.html" class="back-link">← 重新排盘</a>
      <h1>八字排盘</h1>
    </header>

    <main>
      <!-- 出生信息摘要 -->
      <section class="card" id="birth-info-section">
        <div id="birth-info" class="birth-info"></div>
      </section>

      <!-- 四柱表格 -->
      <section class="card" id="bazi-table-section">
        <h2>四柱八字</h2>
        <div class="bazi-table">
          <div class="pillar">
            <div class="pillar-label">时柱</div>
            <div class="tiangan" id="hour-tg"></div>
            <div class="dizhi"   id="hour-dz"></div>
          </div>
          <div class="pillar">
            <div class="pillar-label">日柱</div>
            <div class="tiangan" id="day-tg"></div>
            <div class="dizhi"   id="day-dz"></div>
          </div>
          <div class="pillar">
            <div class="pillar-label">月柱</div>
            <div class="tiangan" id="month-tg"></div>
            <div class="dizhi"   id="month-dz"></div>
          </div>
          <div class="pillar">
            <div class="pillar-label">年柱</div>
            <div class="tiangan" id="year-tg"></div>
            <div class="dizhi"   id="year-dz"></div>
          </div>
        </div>
      </section>

      <!-- 五行统计 -->
      <section class="card">
        <h2>五行分析</h2>
        <div class="wuxing-bars" id="wuxing-bars"></div>
      </section>

      <!-- 大运 -->
      <section class="card">
        <h2>大运排盘</h2>
        <div id="dayun-section"></div>
      </section>

      <!-- 特殊年份 -->
      <section class="card card-warning">
        <h2>天克地冲 · 岁运并临</h2>
        <div id="special-years-section"></div>
      </section>

      <!-- 命理解读区 -->
      <section class="card card-premium" id="analysis-section">
        <h2>资深命理师解读</h2>
        <div id="analysis-locked" style="display:none">
          <p class="price-desc">由资深命理师为您分析日主强弱、用神喜忌、性格财运</p>
        </div>
        <div id="analysis-loading" style="display:none">
          <p class="price-desc">命理师正在为您解读，请稍候...</p>
        </div>
        <div id="analysis-content" style="display:none">
          <div id="analysis-text" class="analysis-text"></div>
        </div>
      </section>
    </main>
  </div>

  <script src="../js/bazi.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
