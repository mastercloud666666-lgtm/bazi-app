  <script>
    window.addEventListener('scroll', () => {
      document.getElementById('navbar').classList.toggle('scrolled', window.scrollY > 20);
    });

    document.querySelectorAll('.ask-tip').forEach(t => {
      t.addEventListener('click', () => {
        const q = document.getElementById('question');
        q.value = t.dataset.q || t.textContent;
        q.focus();
      });
    });

    // 摇卦：连摇三次（上卦1-8 / 下卦1-8 / 动爻1-6），摇完自动解卦
    (function () {
      const stage  = document.getElementById('shake-stage');
      const btn    = document.getElementById('shake-btn');
      const status = document.getElementById('shake-status');
      const ranges = [8, 8, 6];
      const stepLabel = ['上卦（1–8）', '下卦（1–8）', '动爻（1–6）'];
      const slotName  = ['上卦', '下卦', '动爻'];
      const nums = [];
      let step = 0;

      btn.addEventListener('click', () => {
        if (step >= 3) return;
        const q = document.getElementById('question').value.trim();
        if (!q) {
          document.getElementById('question').focus();
          status.textContent = '请先写下你要问的事，再静心摇卦';
          return;
        }
        btn.disabled = true;
        stage.classList.add('shaking');
        setTimeout(() => {
          stage.classList.remove('shaking');
          const n = Math.floor(Math.random() * ranges[step]) + 1;
          nums[step] = n;
          const slot = stage.querySelector('.shake-slot[data-i="' + step + '"]');
          slot.textContent = slotName[step] + ' ' + n;
          slot.classList.add('filled');
          step++;
          if (step < 3) {
            status.textContent = '第 ' + (step + 1) + ' / 3 次：摇出「' + stepLabel[step] + '」';
            btn.disabled = false;
          } else {
            status.innerHTML = '三爻已成卦（' + slotName[0] + nums[0] + '·' + slotName[1] + nums[1] + '·' + slotName[2] + nums[2] + '），正在为你解卦，约需 10–20 秒，请稍候<span class="dots"></span>';
            btn.textContent = '解 卦 中…';
            stage.classList.add('divining');
            castDivination(nums);
          }
        }, 680);
      });

      async function castDivination(n) {
        const guaTag = slotName[0] + n[0] + ' · ' + slotName[1] + n[1] + ' · ' + slotName[2] + n[2];
        const payload = {
          service: 'zhanbu', method: 'gaodao',
          category: document.getElementById('category').value,
          question: document.getElementById('question').value.trim(),
          number1: n[0], number2: n[1], number3: n[2],
          stream: true
        };
        const resultEl = document.getElementById('result-text');
        const section = document.getElementById('result-section');
        const DISCLAIMER = '\n\n以上内容为传统文化推演，仅供参考，请理性看待，切勿迷信。';
        const finish = (label) => {
          stage.classList.remove('divining');
          status.textContent = label;
          btn.textContent = '重新摇卦';
          btn.disabled = false;
          btn.onclick = () => location.reload();
        };
        try {
          const res = await fetch('https://rcyssrsnalefzhzsvswm.supabase.co/functions/v1/analyze', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SUPABASE_ANON },
            body: JSON.stringify(payload)
          });
          const ctype = res.headers.get('Content-Type') || '';
          const canStream = res.ok && res.body && res.body.getReader && ctype.includes('text/event-stream');

          if (canStream) {
            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            let full = '', buf = '', shown = false;
            outer: while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              buf += decoder.decode(value, { stream: true });
              const lines = buf.split('\n');
              buf = lines.pop() || '';
              for (const line of lines) {
                if (!line.startsWith('data: ')) continue;
                const data = line.slice(6).trim();
                if (data === '[DONE]') break outer;
                try {
                  const delta = JSON.parse(data).choices?.[0]?.delta?.content || '';
                  if (!delta) continue;
                  full += delta;
                  if (!shown) {
                    shown = true;
                    stage.classList.remove('divining');
                    status.textContent = '正在书写卦象解读…';
                    section.style.display = 'block';
                    section.scrollIntoView({ behavior: 'smooth', block: 'start' });
                  }
                  resultEl.textContent = (typeof cleanAnalysis === 'function' ? cleanAnalysis(full) : full);
                } catch {}
              }
            }
            if (!full.trim()) throw new Error('empty');
            resultEl.textContent = (typeof cleanAnalysis === 'function' ? cleanAnalysis(full) : full) + DISCLAIMER;
            finish('已成卦：' + guaTag + '，解读见下方');
          } else {
            // 回退：非流式
            const data = await res.json().catch(() => ({}));
            const text = data.analysis || '';
            if (!text.trim()) throw new Error('empty');
            showResult(text);
            section.scrollIntoView({ behavior: 'smooth', block: 'start' });
            finish('已成卦：' + guaTag + '，解读见下方');
          }
        } catch (err) {
          finish('解卦超时或失败，请点按钮重新摇卦');
        }
      }
    })();
  </script>
