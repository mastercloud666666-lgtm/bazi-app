      let step = 0;

      btn.addEventListener('click', () => {
        if (window.YZVerify && !YZVerify.passed()) { YZVerify.require(function(){}); return; }
        if (step >= 3) return;
        const t = T();
        const q = document.getElementById('question').value.trim();
        if (!q) {
          document.getElementById('question').focus();
          status.textContent = t.needQ;
          return;
        }
        btn.disabled = true;
        Zstate.busy = true;
        stage.classList.add('shaking');
        setTimeout(() => {
          stage.classList.remove('shaking');
          const n = Math.floor(Math.random() * ranges[step]) + 1;
          nums[step] = n;
          const slot = stage.querySelector('.shake-slot[data-i="' + step + '"]');
          slot.textContent = t.slotName[step] + ' ' + n;
          slot.classList.add('filled');
          step++; Zstate.step = step;
          if (step < 3) {
            status.textContent = t.statusStep(step + 1, t.stepLabel[step]);
            btn.disabled = false;
          } else {
            const tag = t.slotName[0]+nums[0]+'·'+t.slotName[1]+nums[1]+'·'+t.slotName[2]+nums[2];
            status.innerHTML = t.divining(tag) + '<span class="dots"></span>';
            btn.textContent = '…';
            stage.classList.add('divining');
            castDivination(nums);
          }
        }, 680);
      });

      async function castDivination(n) {
        const t = T();
        const guaTag = t.slotName[0] + n[0] + ' · ' + t.slotName[1] + n[1] + ' · ' + t.slotName[2] + n[2];
        const payload = {
          service: 'zhanbu', method: 'gaodao',
          category: document.getElementById('category').value,
          question: document.getElementById('question').value.trim(),
          number1: n[0], number2: n[1], number3: n[2],
          lang: zLang(), stream: true
        };
        const resultEl = document.getElementById('result-text');
        const section = document.getElementById('result-section');
        const finish = (label) => {
          stage.classList.remove('divining');
          status.textContent = label;
          btn.textContent = t.btnRedo;
          btn.disabled = false;
          btn.onclick = () => location.reload();
        };
        try {
          const res = await fetch('https://rcyssrsnalefzhzsvswm.supabase.co/functions/v1/analyze', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SUPABASE_ANON },
            body: JSON.stringify(payload)
          });
          const ctype = res.headers.get('Content-Type') || '';
          const canStream = res.ok && res.body && res.body.getReader && ctype.includes('text/event-stream');

          if (canStream) {
            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            let full = '', buf = '', shown = false;
            outer: while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              buf += decoder.decode(value, { stream: true });
              const lines = buf.split('\n');
              buf = lines.pop() || '';
              for (const line of lines) {
                if (!line.startsWith('data: ')) continue;
                const data = line.slice(6).trim();
                if (data === '[DONE]') break outer;
                try {
                  const delta = JSON.parse(data).choices?.[0]?.delta?.content || '';
                  if (!delta) continue;
                  full += delta;
                  if (!shown) {
                    shown = true;
                    stage.classList.remove('divining');
                    status.textContent = t.writing;
                    section.style.display = 'block';
                    section.scrollIntoView({ behavior: 'smooth', block: 'start' });
                  }
                  resultEl.textContent = (typeof cleanAnalysis === 'function' ? cleanAnalysis(full) : full);
                } catch {}
              }
            }
            if (!full.trim()) throw new Error('empty');
            resultEl.textContent = (typeof cleanAnalysis === 'function' ? cleanAnalysis(full) : full) + t.disclaimer;
            finish(t.done(guaTag));
            zbOfferSave({ type:'zhanbu', category: payload.category, question: payload.question, title: (payload.question||'').slice(0,40), meta:{ numbers:n, gua: guaTag }, result_text: resultEl.textContent });
          } else {
            const data = await res.json().catch(() => ({}));
            const text = data.analysis || '';
            if (!text.trim()) throw new Error('empty');
            resultEl.textContent = (typeof cleanAnalysis === 'function' ? cleanAnalysis(text) : text) + t.disclaimer;
            section.style.display = 'block';
            section.scrollIntoView({ behavior: 'smooth', block: 'start' });
            finish(t.done(guaTag));
            zbOfferSave({ type:'zhanbu', category: payload.category, question: payload.question, title: (payload.question||'').slice(0,40), meta:{ numbers:n, gua: guaTag }, result_text: resultEl.textContent });
          }
        } catch (err) {
          finish(t.fail);
        }
      }
    })();

    applyZhanbuLang();
    document.addEventListener('change', e => {
      if (e.target && e.target.classList && e.target.classList.contains('navbar-lang-select')) {
        applyZhanbuLang();
      }
    });
  </script>
  <script src="js/site-lang.js"></script>
</body>
