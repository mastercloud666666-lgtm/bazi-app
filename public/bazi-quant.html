<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>八字量化辅助系统 · 云子文化</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/mckinsey-style.css">
  <style>
    :root {
      --quant-green:  #0D7A3E;
      --quant-red:    #C53030;
      --quant-gold:   #B7791F;
      --quant-blue:   #0066CC;
      --quant-gray:   #4A5568;
    }

    /* ── 布局 ── */
    .quant-layout {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 24px;
      max-width: 1280px;
      margin: 0 auto;
      padding: 24px 20px 60px;
    }
    @media (max-width: 900px) {
      .quant-layout { grid-template-columns: 1fr; }
    }

    /* ── 输入面板 ── */
    .input-panel {
      position: sticky;
      top: 80px;
      height: fit-content;
    }
    .input-panel .mk-card-header { background: var(--primary); }
    .input-panel .mk-card-title  { color: #fff; }
    .input-panel .mk-card-dot    { background: var(--accent); }

    .form-row { margin-bottom: 16px; }
    .form-row label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-gray);
      margin-bottom: 6px;
    }
    .form-row input, .form-row select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
      font-family: var(--font-main);
      background: #fff;
      box-sizing: border-box;
    }
    .radio-group { display: flex; gap: 12px; }
    .radio-group label {
      display: flex; align-items: center; gap: 6px;
      font-size: 14px; font-weight: 400; color: var(--text-main); cursor: pointer;
    }
    .btn-calc {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }
    .btn-calc:hover { background: #0d3060; }

    /* ── 结果区 ── */
    #results { display: none; }
    .results-grid { display: flex; flex-direction: column; gap: 20px; }

    /* ── 四柱 ── */
    .pillars-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .pillar-cell {
      text-align: center;
      padding: 14px 8px;
      background: var(--bg-light);
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .pillar-label { font-size: 11px; font-weight: 600; color: var(--text-gray); letter-spacing: 2px; margin-bottom: 8px; }
    .pillar-ss    { font-size: 11px; color: var(--quant-gold); margin-bottom: 4px; }
    .p-tg { font-size: 26px; font-weight: 700; font-family: var(--font-serif); color: var(--primary); line-height: 1; }
    .p-dz { font-size: 22px; font-weight: 600; font-family: var(--font-serif); color: var(--accent); margin-top: 6px; }
    .p-ss { font-size: 11px; color: var(--quant-gray); margin-top: 4px; }

    /* ── 得分条 ── */
    .score-bar-wrap { margin: 12px 0 4px; }
    .score-bar-bg {
      height: 12px;
      background: #e2e8f0;
      border-radius: 6px;
      overflow: hidden;
    }
    .score-bar-fill {
      height: 100%;
      border-radius: 6px;
      transition: width 0.8s ease;
    }
    .score-label-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-gray);
      margin-top: 4px;
    }

    /* ── 信号徽章 ── */
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .badge-xi   { background: #C6F6D5; color: var(--quant-green); }
    .badge-ji   { background: #FED7D7; color: var(--quant-red); }
    .badge-mid  { background: #EDF2F7; color: var(--quant-gray); }
    .badge-strong { background: #EBF4FF; color: var(--quant-blue); }

    /* ── 时机表格 ── */
    .timing-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .timing-table th {
      background: var(--bg-light);
      padding: 8px 12px;
      text-align: left;
      font-weight: 600;
      color: var(--text-gray);
      font-size: 12px;
      border-bottom: 1px solid var(--border);
    }
    .timing-table td {
      padding: 10px 12px;
      border-bottom: 1px solid #f0f4f8;
      color: var(--text-main);
    }
    .timing-table tr:last-child td { border-bottom: none; }

    /* ── 综合评分 ── */
    .composite-score {
      font-size: 56px;
      font-weight: 700;
      font-family: var(--font-serif);
      line-height: 1;
      text-align: center;
      padding: 16px 0 8px;
    }
    .composite-action {
      text-align: center;
      font-size: 18px;
      font-weight: 600;
      padding: 8px 24px;
      border-radius: 8px;
      display: inline-block;
    }
    .action-buy    { background: #C6F6D5; color: var(--quant-green); }
    .action-light  { background: #FEFCBF; color: #975A16; }
    .action-hold   { background: #EDF2F7; color: var(--quant-gray); }
    .action-sell   { background: #FED7D7; color: var(--quant-red); }

    /* ── 行业推荐 ── */
    .industry-wx-block { margin-bottom: 20px; }
    .industry-wx-title {
      font-size: 15px; font-weight: 700;
      color: var(--primary); margin-bottom: 10px;
      padding-left: 10px;
      border-left: 3px solid var(--accent);
    }
    .industry-list { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 8px; }
    .industry-list li {
      background: var(--bg-light);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 5px 12px;
      font-size: 13px;
      color: var(--text-main);
    }

    /* ── 出场预警 ── */
    .exit-alert {
      background: #FFF5F5;
      border: 1px solid #FED7D7;
      border-radius: 8px;
      padding: 14px 16px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .exit-alert-icon { font-size: 20px; flex-shrink: 0; }
    .exit-alert-text { font-size: 14px; color: #742A2A; line-height: 1.6; }
    .exit-alert-level { font-weight: 700; color: var(--quant-red); }

    /* ── 推送测试区 ── */
    .push-section {
      background: #F0F7FF;
      border: 1px solid #BEE3F8;
      border-radius: 8px;
      padding: 20px;
    }
    .push-section h4 { margin: 0 0 12px; font-size: 15px; color: var(--primary); }
    .push-input-row { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
    .push-input-row input { flex: 1; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; }
    .btn-push {
      padding: 10px 20px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-push:hover { background: #0052A3; }
    .push-result { font-size: 13px; color: var(--quant-gray); margin-top: 8px; min-height: 20px; }
    .push-result.ok  { color: var(--quant-green); }
    .push-result.err { color: var(--quant-red); }

    /* ── Hero ── */
    .quant-hero {
      background: linear-gradient(135deg, #0A2540 0%, #0D3060 100%);
      color: #fff;
      padding: 40px 20px 36px;
      text-align: center;
    }
    .quant-hero h1 { font-size: 26px; font-weight: 700; margin: 0 0 8px; font-family: var(--font-serif); }
    .quant-hero p  { font-size: 14px; color: #94A3B8; margin: 0; }
  </style>
</head>
<body>

<!-- 导航 -->
<nav class="mk-nav">
  <div class="mk-nav-inner">
    <a class="mk-nav-brand" href="/">云子文化</a>
    <div class="mk-nav-links">
      <a href="/">首页</a>
      <a href="/hepan.html">合盘分析</a>
      <a href="/bazi-quant.html" class="active">量化辅助</a>
    </div>
  </div>
</nav>

<!-- Hero -->
<div class="quant-hero">
  <h1>八字量化辅助系统</h1>
  <p>基于个人喜用神 × 宏观经济周期，生成行业推荐与买卖时机信号</p>
</div>

<!-- 主体 -->
<div class="quant-layout">

  <!-- 左侧：输入 -->
  <div class="input-panel">
    <div class="mk-card">
      <div class="mk-card-header">
        <span class="mk-card-dot"></span>
        <span class="mk-card-title">输入生辰信息</span>
      </div>
      <div class="mk-card-body">
        <form id="quant-form">
          <div class="form-row">
            <label>姓名（可选）</label>
            <input type="text" id="inp-name" placeholder="用于推送标注">
          </div>
          <div class="form-row">
            <label>性别</label>
            <div class="radio-group">
              <label><input type="radio" name="gender" value="男" checked> 男</label>
              <label><input type="radio" name="gender" value="女"> 女</label>
            </div>
          </div>
          <div class="form-row">
            <label>出生年份</label>
            <input type="number" id="inp-year" placeholder="如：1990" min="1900" max="2024" required>
          </div>
          <div class="form-row">
            <label>出生月份</label>
            <select id="inp-month" required>
              <option value="">选择月份</option>
              <option>1</option><option>2</option><option>3</option>
              <option>4</option><option>5</option><option>6</option>
              <option>7</option><option>8</option><option>9</option>
              <option>10</option><option>11</option><option>12</option>
            </select>
          </div>
          <div class="form-row">
            <label>出生日期</label>
            <input type="number" id="inp-day" placeholder="如：15" min="1" max="31" required>
          </div>
          <div class="form-row">
            <label>出生时辰（时）</label>
            <select id="inp-hour" required>
              <option value="">选择时辰</option>
              <option value="0">00:00 子时（0-1点）</option>
              <option value="1">01:00 丑时（1-3点）</option>
              <option value="3">03:00 丑时（3点）</option>
              <option value="5">05:00 寅时</option>
              <option value="7">07:00 卯时</option>
              <option value="9">09:00 辰时</option>
              <option value="11">11:00 巳时</option>
              <option value="13">13:00 午时</option>
              <option value="15">15:00 未时</option>
              <option value="17">17:00 申时</option>
              <option value="19">19:00 酉时</option>
              <option value="21">21:00 戌时</option>
              <option value="23">23:00 亥时</option>
            </select>
          </div>
          <button type="submit" class="btn-calc">开始分析</button>
        </form>
      </div>
    </div>
  </div>

  <!-- 右侧：结果 -->
  <div id="results">
    <div class="results-grid">

      <!-- 1. 命局基础 -->
      <div class="mk-card" id="card-pillars">
        <div class="mk-card-header">
          <span class="mk-card-dot"></span>
          <span class="mk-card-title">命局基础</span>
        </div>
        <div class="mk-card-body">
          <div class="pillars-grid" id="pillars-display"></div>
          <div style="margin-top:20px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
              <span style="font-size:14px; font-weight:600; color:var(--text-main);">命局强弱得分</span>
              <span id="score-val" style="font-size:18px; font-weight:700; color:var(--primary);"></span>
            </div>
            <div class="score-bar-wrap">
              <div class="score-bar-bg">
                <div class="score-bar-fill" id="score-bar" style="width:0;"></div>
              </div>
              <div class="score-label-row">
                <span>身弱（&lt;40）</span><span>中和（40-60）</span><span>身强（&gt;60）</span>
              </div>
            </div>
            <div id="strength-label" style="margin-top:12px; font-size:14px; line-height:1.7;"></div>
          </div>
        </div>
      </div>

      <!-- 2. 喜用神 & 投资风格 -->
      <div class="mk-card" id="card-style">
        <div class="mk-card-header">
          <span class="mk-card-dot"></span>
          <span class="mk-card-title">喜用神 · 投资风格</span>
        </div>
        <div class="mk-card-body">
          <table class="timing-table">
            <tbody id="style-table"></tbody>
          </table>
        </div>
      </div>

      <!-- 3. 今日时机信号 -->
      <div class="mk-card" id="card-timing">
        <div class="mk-card-header">
          <span class="mk-card-dot"></span>
          <span class="mk-card-title" id="timing-card-title">今日时机信号</span>
        </div>
        <div class="mk-card-body">
          <!-- 综合评分 -->
          <div style="text-align:center; margin-bottom:20px;">
            <div class="composite-score" id="composite-score"></div>
            <div id="composite-action"></div>
          </div>
          <!-- 周期明细 -->
          <table class="timing-table">
            <thead>
              <tr>
                <th>周期</th><th>干支</th><th>天干十神</th><th>地支十神</th><th>信号</th>
              </tr>
            </thead>
            <tbody id="timing-table"></tbody>
          </table>
          <!-- 盘中时段 -->
          <div style="margin-top:20px;">
            <div style="font-size:13px; font-weight:600; color:var(--text-gray); margin-bottom:10px;">A股盘中时段（流时天干）</div>
            <table class="timing-table">
              <thead>
                <tr><th>时段</th><th>时间</th><th>时干</th><th>十神</th><th>信号</th><th>建议</th></tr>
              </thead>
              <tbody id="time-table"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- 4. 行业推荐 -->
      <div class="mk-card" id="card-industry">
        <div class="mk-card-header">
          <span class="mk-card-dot"></span>
          <span class="mk-card-title">行业推荐（基于喜用五行）</span>
        </div>
        <div class="mk-card-body" id="industry-body"></div>
      </div>

      <!-- 5. 出场预警 -->
      <div class="mk-card" id="card-exit" style="display:none;">
        <div class="mk-card-header" style="background:#FFF5F5; border-bottom-color:#FED7D7;">
          <span class="mk-card-dot" style="background:#E53E3E;"></span>
          <span class="mk-card-title" style="color:#C53030;">出场预警</span>
        </div>
        <div class="mk-card-body" id="exit-body"></div>
      </div>

      <!-- 6. 企业微信推送测试 -->
      <div class="mk-card" id="card-push">
        <div class="mk-card-header">
          <span class="mk-card-dot"></span>
          <span class="mk-card-title">企业微信推送测试</span>
        </div>
        <div class="mk-card-body">
          <div class="push-section">
            <h4>发送今日信号到企业微信</h4>
            <p style="font-size:13px; color:var(--text-gray); margin:0 0 14px;">
              输入企业微信用户ID（内部成员userid或外部联系人external_userid），测试个性化推送。
            </p>
            <div class="push-input-row">
              <input type="text" id="inp-wecom-userid" placeholder="企业微信 userid / external_userid">
              <button class="btn-push" onclick="testPush()">发送测试</button>
            </div>
            <div class="push-result" id="push-result"></div>
            <div style="margin-top:14px; padding-top:14px; border-top:1px solid #BEE3F8;">
              <div style="font-size:12px; color:var(--text-gray); margin-bottom:8px;">预览推送内容：</div>
              <pre id="push-preview" style="font-size:12px; color:var(--quant-gray); white-space:pre-wrap; line-height:1.7; background:#fff; padding:12px; border-radius:6px; border:1px solid var(--border);"></pre>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="js/bazi.js"></script>
<script src="js/bazi-quant-engine.js"></script>
<script>
  const { fullAnalysis, formatPushMessage } = window.BaziQuant;
  let _lastResult = null;

  // ── 工具 ──────────────────────────────────────────────────────────

  function signalBadge(signal) {
    if (signal === '喜用') return `<span class="badge badge-xi">✅ 喜用</span>`;
    if (signal === '忌神') return `<span class="badge badge-ji">❌ 忌神</span>`;
    return `<span class="badge badge-mid">➖ 中性</span>`;
  }

  function actionClass(action) {
    if (action === '建仓/加仓') return 'action-buy';
    if (action === '轻仓观望')  return 'action-light';
    if (action === '持仓不动')  return 'action-hold';
    return 'action-sell';
  }

  function scoreColor(score) {
    if (score >= 70) return '#0D7A3E';
    if (score >= 50) return '#B7791F';
    if (score >= 30) return '#0066CC';
    return '#C53030';
  }

  // ── 渲染四柱 ─────────────────────────────────────────────────────

  function renderPillars(p) {
    const labels = ['年柱','月柱','日柱','时柱'];
    const cols   = ['year','month','day','hour'];
    return cols.map((c, i) => `
      <div class="pillar-cell">
        <div class="pillar-label">${labels[i]}</div>
        <div class="pillar-ss">${p[c].ss}</div>
        <div class="p-tg">${p[c].tg}</div>
        <div class="p-dz">${p[c].dz}</div>
        <div class="p-ss">${p[c].ssDz}</div>
      </div>`).join('');
  }

  // ── 渲染评分条 ────────────────────────────────────────────────────

  function renderScore(score, xiYong) {
    document.getElementById('score-val').textContent = `${score}/100`;
    const bar = document.getElementById('score-bar');
    bar.style.width = `${score}%`;
    bar.style.background = score > 60 ? '#0D7A3E' : score < 40 ? '#C53030' : '#B7791F';

    const label = document.getElementById('strength-label');
    label.innerHTML = `
      <div style="margin-bottom:6px;">
        <span class="badge badge-strong">${xiYong.strength}</span>
        <span style="margin-left:8px; color:var(--text-gray); font-size:13px;">${xiYong.label}</span>
      </div>
      <div style="font-size:13px; color:var(--quant-gray);">${xiYong.detail}</div>`;
  }

  // ── 渲染投资风格 ──────────────────────────────────────────────────

  function renderStyle(xiYong, caiXing) {
    const rows = [
      ['喜用五行', xiYong.xiYongWx.join(' · ')],
      ['投资取向', xiYong.investStyle],
      ['财星类型', caiXing.style],
      ['持仓周期', caiXing.holdPeriod],
      ['股票类型', caiXing.stockType],
    ];
    document.getElementById('style-table').innerHTML = rows.map(([k,v]) => `
      <tr>
        <td style="color:var(--text-gray); font-size:13px; width:90px;">${k}</td>
        <td style="font-weight:500;">${v}</td>
      </tr>`).join('');
  }

  // ── 渲染时机信号 ──────────────────────────────────────────────────

  function renderTiming(timing, curDaYun) {
    const { pillars, composite, action, lnScore, lyScore, lrScore, dyScore,
            siEval, wuEval, weiEval, timeStems } = timing;
    const { liuNian, liuYue, liuRi, today } = pillars;

    document.getElementById('timing-card-title').textContent = `今日时机信号 · ${today}`;

    const scoreEl = document.getElementById('composite-score');
    scoreEl.textContent = composite;
    scoreEl.style.color = scoreColor(composite);

    const actionEl = document.getElementById('composite-action');
    actionEl.innerHTML = `<span class="composite-action ${actionClass(action)}">${action}</span>`;

    // 周期表
    const dyGz = curDaYun ? curDaYun.gz : '—';
    const rows = [
      { label:'大运', gz: dyGz, tgSS: dyScore.tg.ss||'—', dzSS: dyScore.dz.ss||'—', sig: dyScore.tg.signal },
      { label:'流年', gz:`${liuNian.tg}${liuNian.dz}`, tgSS:lnScore.tg.ss, dzSS:lnScore.dz.ss, sig:lnScore.tg.signal },
      { label:'流月', gz:`${liuYue.tg}${liuYue.dz}`,   tgSS:lyScore.tg.ss, dzSS:lyScore.dz.ss, sig:lyScore.tg.signal },
      { label:'流日', gz:`${liuRi.tg}${liuRi.dz}`,     tgSS:lrScore.tg.ss, dzSS:lrScore.dz.ss, sig:lrScore.tg.signal },
    ];
    document.getElementById('timing-table').innerHTML = rows.map(r => `
      <tr>
        <td style="font-weight:600; color:var(--text-gray); font-size:13px;">${r.label}</td>
        <td style="font-family:var(--font-serif); font-size:16px; font-weight:700;">${r.gz}</td>
        <td style="font-size:13px;">${r.tgSS}</td>
        <td style="font-size:13px;">${r.dzSS}</td>
        <td>${signalBadge(r.sig)}</td>
      </tr>`).join('');

    // 盘中时段
    const timeSuggestion = (ev) =>
      ev.signal === '喜用' ? '可建仓/加仓' :
      ev.signal === '忌神' ? '回避操作' : '观望为主';

    const timeRows = [
      { label:'上午场', time:'09:30-11:00', stem:timeStems.si,  ev:siEval  },
      { label:'午时尾', time:'11:00-11:30', stem:timeStems.wu,  ev:wuEval  },
      { label:'下午场', time:'13:00-15:00', stem:timeStems.wei, ev:weiEval },
    ];
    document.getElementById('time-table').innerHTML = timeRows.map(r => `
      <tr>
        <td style="font-weight:600;">${r.label}</td>
        <td style="color:var(--text-gray); font-size:13px;">${r.time}</td>
        <td style="font-family:var(--font-serif); font-size:18px; font-weight:700;">${r.stem}</td>
        <td style="font-size:13px;">${r.ev.ss}</td>
        <td>${signalBadge(r.ev.signal)}</td>
        <td style="font-size:13px;">${timeSuggestion(r.ev)}</td>
      </tr>`).join('');
  }

  // ── 渲染行业推荐 ──────────────────────────────────────────────────

  function renderIndustry(indRec) {
    const body = document.getElementById('industry-body');
    if (!indRec.length) {
      body.innerHTML = '<p style="color:var(--text-gray);">暂无推荐（中和命格，宏观为主）</p>';
      return;
    }
    body.innerHTML = indRec.map(r => `
      <div class="industry-wx-block">
        <div class="industry-wx-title">${r.wx}系行业</div>
        <div style="margin-bottom:8px; font-size:13px; color:var(--text-gray);">
          主推（${r.primary.label}）
        </div>
        <ul class="industry-list">${r.primary.list.map(i=>`<li>${i}</li>`).join('')}</ul>
        <div style="margin:10px 0 6px; font-size:13px; color:var(--text-gray);">
          次选（${r.secondary.label}）
        </div>
        <ul class="industry-list">${r.secondary.list.map(i=>`<li style="opacity:0.7;">${i}</li>`).join('')}</ul>
      </div>`).join('');
  }

  // ── 渲染出场预警 ──────────────────────────────────────────────────

  function renderExit(exitSigs) {
    const card = document.getElementById('card-exit');
    const body = document.getElementById('exit-body');
    if (!exitSigs.length) { card.style.display = 'none'; return; }
    card.style.display = '';
    body.innerHTML = exitSigs.map(s => `
      <div class="exit-alert">
        <div class="exit-alert-icon">⚠️</div>
        <div class="exit-alert-text">
          <span class="exit-alert-level">${s.level}</span> — ${s.reason}
        </div>
      </div>`).join('<div style="height:10px;"></div>');
  }

  // ── 表单提交 ──────────────────────────────────────────────────────

  document.getElementById('quant-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const year   = parseInt(document.getElementById('inp-year').value);
    const month  = parseInt(document.getElementById('inp-month').value);
    const day    = parseInt(document.getElementById('inp-day').value);
    const hour   = parseInt(document.getElementById('inp-hour').value);
    const gender = document.querySelector('input[name="gender"]:checked').value;

    if (!year||!month||!day||isNaN(hour)) {
      alert('请填写完整生辰信息');
      return;
    }

    try {
      const result = fullAnalysis(year, month, day, hour, gender);
      _lastResult  = result;

      document.getElementById('results').style.display = 'block';

      renderPillars(result.pillarsWithSS);
      renderScore(result.score, result.xiYong);
      renderStyle(result.xiYong, result.caiXing);
      renderTiming(result.timing, result.curDaYun);
      renderIndustry(result.indRec);
      renderExit(result.exitSigs);

      // 推送预览
      const name = document.getElementById('inp-name').value || '用户';
      document.getElementById('push-preview').textContent = formatPushMessage(result, name);

      document.getElementById('results').scrollIntoView({ behavior:'smooth', block:'start' });
    } catch(err) {
      console.error(err);
      alert('计算出错，请检查输入：' + err.message);
    }
  });
