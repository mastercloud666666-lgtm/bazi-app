<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>支付成功 · 云子命理</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #0A2540;
      --accent: #0066CC;
      --bg-white: #FFFFFF;
      --bg-light: #F8F9FA;
      --border: #DEE2E6;
      --text-dark: #1A1A1A;
      --text-gray: #6C757D;
      --font-zh: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }

    body {
      font-family: var(--font-zh);
      background: var(--bg-light);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: var(--text-dark);
    }

    .container {
      max-width: 400px;
      width: 100%;
      text-align: center;
      background: var(--bg-white);
      border-radius: 16px;
      padding: 48px 32px;
      border: 1px solid var(--border);
      box-shadow: 0 8px 40px rgba(0,0,0,0.08);
    }

    .icon {
      width: 80px; height: 80px;
      margin: 0 auto 24px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 32px rgba(16, 185, 129, 0.3);
      animation: scaleIn 0.5s ease-out;
    }

    .icon svg {
      width: 40px; height: 40px;
      stroke: white; stroke-width: 3; fill: none;
      stroke-linecap: round; stroke-linejoin: round;
      animation: drawCheck 0.6s ease-out 0.3s both;
    }

    @keyframes scaleIn {
      from { transform: scale(0); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }

    @keyframes drawCheck {
      from { stroke-dasharray: 50; stroke-dashoffset: 50; }
      to   { stroke-dashoffset: 0; }
    }

    h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 16px;
      color: var(--primary);
    }

    p {
      font-size: 14px;
      color: var(--text-gray);
      line-height: 1.8;
      margin-bottom: 8px;
    }

    .loading {
      display: inline-block;
      width: 20px; height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .btn {
      display: inline-block;
      padding: 12px 32px;
      background: var(--accent);
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      margin-top: 24px;
      transition: all 0.2s ease;
      border: none;
      cursor: pointer;
      font-family: var(--font-zh);
    }

    .btn:hover {
      background: #0052A3;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 102, 204, 0.3);
    }

    .btn-secondary {
      background: transparent;
      border: 2px solid var(--border);
      color: var(--text-gray);
      margin-top: 12px;
    }

    .btn-secondary:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: transparent;
      box-shadow: none;
    }

    .hidden { display: none; }

    .countdown {
      font-size: 12px;
      color: var(--text-gray);
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg viewBox="0 0 24 24">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>

    <h1>支付成功</h1>

    <div id="loading">
      <p><span class="loading"></span>正在为您生成命理报告…</p>
      <p class="countdown"><span id="countdown">5</span> 秒后自动跳转</p>
    </div>

    <div id="success" class="hidden">
      <p>命理报告已生成完成！</p>
      <button onclick="goToResult()" class="btn">查看命理报告</button>
    </div>

    <div id="error" class="hidden">
      <p>报告生成时间较长，请稍后查看</p>
      <button onclick="goToResult()" class="btn">前往查看</button>
      <button onclick="location.reload()" class="btn btn-secondary">刷新页面</button>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const tradeNo = params.get('trade_no');

    if (!tradeNo) {
      document.getElementById('loading').innerHTML = '<p>参数错误，请重新发起支付</p>';
    } else {
      let countdown = 5;
      const countdownEl = document.getElementById('countdown');

      const timer = setInterval(() => {
        countdown--;
        if (countdownEl) countdownEl.textContent = countdown;
        if (countdown <= 0) {
          clearInterval(timer);
          goToResult();
        }
      }, 1000);

      function goToResult() {
        window.location.href = `result.html?trade_no=${tradeNo}`;
      }

      window.goToResult = goToResult;
    }
  </script>
</body>
</html>
