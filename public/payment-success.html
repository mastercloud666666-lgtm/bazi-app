<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>支付成功 · 云子命理</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Serif SC', 'PingFang SC', 'Microsoft YaHei', serif;
      background: linear-gradient(135deg, #0a0f1d 0%, #1a1f35 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #e6e9f0;
    }

    .container {
      max-width: 400px;
      width: 100%;
      text-align: center;
    }

    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 32px rgba(16, 185, 129, 0.3);
      animation: scaleIn 0.5s ease-out;
    }

    .icon svg {
      width: 40px;
      height: 40px;
      stroke: white;
      stroke-width: 3;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      animation: drawCheck 0.6s ease-out 0.3s both;
    }

    @keyframes scaleIn {
      from {
        transform: scale(0);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    @keyframes drawCheck {
      from {
        stroke-dasharray: 50;
        stroke-dashoffset: 50;
      }
      to {
        stroke-dashoffset: 0;
      }
    }

    h1 {
      font-size: 24px;
      font-weight: 400;
      margin-bottom: 16px;
      letter-spacing: 2px;
    }

    p {
      font-size: 14px;
      color: #9ca3af;
      line-height: 1.8;
      margin-bottom: 8px;
    }

    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid #10b981;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .btn {
      display: inline-block;
      padding: 12px 32px;
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 15px;
      margin-top: 24px;
      transition: all 0.3s ease;
      border: none;
      cursor: pointer;
      letter-spacing: 1px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.4);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid #4b5563;
      margin-top: 12px;
    }

    .btn-secondary:hover {
      background: rgba(75, 85, 99, 0.2);
      box-shadow: none;
    }

    .hidden {
      display: none;
    }

    .countdown {
      font-size: 12px;
      color: #6b7280;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg viewBox="0 0 24 24">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>

    <h1>支付成功</h1>

    <div id="loading">
      <p><span class="loading"></span>正在为您生成命理报告…</p>
      <p class="countdown"><span id="countdown">5</span> 秒后自动跳转</p>
    </div>

    <div id="success" class="hidden">
      <p>命理报告已生成完成！</p>
      <button onclick="goToResult()" class="btn">查看命理报告</button>
    </div>

    <div id="error" class="hidden">
      <p>报告生成时间较长，请稍后查看</p>
      <button onclick="goToResult()" class="btn">前往查看</button>
      <button onclick="location.reload()" class="btn btn-secondary">刷新页面</button>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const tradeNo = params.get('trade_no');

    if (!tradeNo) {
      document.getElementById('loading').innerHTML = '<p>参数错误，请重新发起支付</p>';
      document.getElementById('loading').querySelector('.loading')?.remove();
    } else {
      // 自动跳转倒计时
      let countdown = 5;
      const countdownEl = document.getElementById('countdown');
      
      const timer = setInterval(() => {
        countdown--;
        if (countdownEl) {
          countdownEl.textContent = countdown;
        }
        if (countdown <= 0) {
          clearInterval(timer);
          goToResult();
        }
      }, 1000);

      // 立即跳转按钮
      function goToResult() {
        window.location.href = `result.html?trade_no=${tradeNo}`;
      }
    }
  </script>
</body>
</html>
