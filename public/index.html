<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>天机命理 · 八字深度解读</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@200;300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    :root {
      --blue-deep:  #1a56db;
      --blue-mid:   #3b82f6;
      --blue-soft:  #93c5fd;
      --blue-pale:  #dbeafe;
      --blue-ice:   #eff6ff;
      --white:      #ffffff;
      --ink:        #1e3a5f;
      --ink2:       #3b5a87;
      --ink3:       #6b89b4;
      --mist:       rgba(59,130,246,0.12);
      --shadow:     rgba(30,86,219,0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100vh;
      font-family: 'Noto Serif SC', 'SimSun', serif;
    }

    body {
      background: #eef4fd;
      color: var(--ink);
      overflow-x: hidden;
    }

    /* ── 背景：蓝白光晕渐变 ── */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 90% 60% at 10% 0%,   rgba(147,197,253,.45) 0%, transparent 55%),
        radial-gradient(ellipse 70% 70% at 90% 100%,  rgba(59,130,246,.20) 0%, transparent 55%),
        radial-gradient(ellipse 60% 50% at 50% 40%,   rgba(239,246,255,.80) 0%, transparent 70%);
      pointer-events: none;
    }

    /* ── 布局 ── */
    .page {
      position: relative; z-index: 1;
      max-width: 500px; margin: 0 auto;
      padding: 28px 20px 70px;
    }

    /* ── 顶部导航 ── */
    nav {
      display: flex; justify-content: center; gap: 4px;
      margin-bottom: 40px;
      animation: fadeUp .5s both;
    }
    nav a {
      padding: 7px 18px; border-radius: 20px;
      color: var(--ink3); text-decoration: none;
      font-size: .82rem; letter-spacing: 2px;
      border: 1px solid transparent;
      transition: all .22s;
    }
    nav a:hover { color: var(--blue-mid); background: rgba(59,130,246,.08); }
    nav a.active {
      color: var(--white);
      background: linear-gradient(135deg, var(--blue-deep), var(--blue-mid));
      box-shadow: 0 4px 12px rgba(59,130,246,.35);
    }

    /* ── 品牌区 ── */
    .brand-wrap {
      text-align: center;
      margin-bottom: 36px;
      animation: fadeUp .6s .08s both;
    }

    /* 3D 水晶立方徽标 */
    .crystal-wrap {
      width: 80px; height: 80px;
      margin: 0 auto 22px;
      position: relative;
      display: flex; align-items: center; justify-content: center;
    }

    /* 外层发光底座 */
    .crystal-glow {
      position: absolute; inset: -8px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(59,130,246,.2) 0%, transparent 70%);
      animation: glowPulse 3s ease-in-out infinite;
    }

    /* 主晶体块 */
    .crystal {
      width: 64px; height: 64px;
      position: relative;
      border-radius: 18px;
      background: linear-gradient(135deg, #ffffff 0%, #e0eeff 40%, #bfdbfe 100%);
      box-shadow:
        0 8px 32px rgba(59,130,246,.30),
        0 2px 8px  rgba(59,130,246,.15),
        inset 0 1px 0 rgba(255,255,255,.9),
        inset 0 -1px 0 rgba(147,197,253,.4);
      display: flex; align-items: center; justify-content: center;
      animation: crystalFloat 4s ease-in-out infinite;
    }

    /* 高光反射 */
    .crystal::before {
      content: '';
      position: absolute;
      top: 6px; left: 6px;
      width: 28px; height: 28px;
      border-radius: 10px;
      background: linear-gradient(135deg, rgba(255,255,255,.85) 0%, rgba(255,255,255,.0) 100%);
    }

    /* 侧面棱线 */
    .crystal::after {
      content: '';
      position: absolute; inset: 0;
      border-radius: 18px;
      border: 1.5px solid rgba(255,255,255,.6);
    }

    /* 洛书SVG */
    .luoshu-svg {
      position: relative; z-index: 1;
      filter: drop-shadow(0 2px 6px rgba(59,130,246,.3));
    }

    /* 底部小圆点装饰 */
    .crystal-dots {
      display: flex; gap: 6px;
      justify-content: center; margin-top: 10px;
    }
    .crystal-dots span {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--blue-soft);
      opacity: .5;
    }
    .crystal-dots span:nth-child(2) { opacity: .8; background: var(--blue-mid); transform: scale(1.2); }

    @keyframes glowPulse {
      0%, 100% { opacity: .6; transform: scale(1); }
      50%       { opacity: 1;  transform: scale(1.08); }
    }
    @keyframes crystalFloat {
      0%, 100% { transform: translateY(0px);   box-shadow: 0 8px 32px rgba(59,130,246,.30), 0 2px 8px rgba(59,130,246,.15), inset 0 1px 0 rgba(255,255,255,.9), inset 0 -1px 0 rgba(147,197,253,.4); }
      50%       { transform: translateY(-6px);  box-shadow: 0 16px 48px rgba(59,130,246,.35), 0 4px 16px rgba(59,130,246,.20), inset 0 1px 0 rgba(255,255,255,.9), inset 0 -1px 0 rgba(147,197,253,.4); }
    }

    /* 洛书标注 */
    .lobook-label {
      font-size: .62rem; letter-spacing: 6px; text-indent: 6px;
      color: var(--blue-mid); opacity: .6;
      margin-top: -4px; margin-bottom: 10px;
    }

    /* 品牌名 */
    .brand-name {
      font-size: 1.65rem; font-weight: 300;
      letter-spacing: 12px; text-indent: 12px;
      color: var(--ink);
      margin-bottom: 8px;
    }

    /* 副标题 */
    .brand-sub {
      font-size: .75rem; letter-spacing: 4px;
      color: var(--ink3);
      margin-bottom: 14px;
    }

    /* 标语 */
    .tagline {
      font-size: .83rem; font-weight: 300;
      line-height: 2.0; letter-spacing: 1.5px;
      color: var(--ink2);
    }
    .tagline em {
      font-style: normal;
      color: var(--blue-deep);
      font-weight: 500;
      background: linear-gradient(90deg, var(--blue-deep), var(--blue-mid));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* ── 表单容器 ── */
    .form-wrap {
      animation: fadeUp .6s .2s both;
    }

    /* 表单卡片 */
    form {
      background: rgba(255,255,255,.82);
      border: 1px solid rgba(255,255,255,.95);
      border-radius: 20px;
      padding: 28px 24px 22px;
      backdrop-filter: blur(24px) saturate(1.5);
      box-shadow:
        0 1px 0 rgba(255,255,255,.8) inset,
        0 20px 60px rgba(30,86,219,.10),
        0 4px 16px rgba(59,130,246,.08);
    }

    /* 节标题 */
    .section-head {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 20px;
    }
    .section-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: linear-gradient(135deg, var(--blue-deep), var(--blue-mid));
      flex-shrink: 0;
      box-shadow: 0 0 8px rgba(59,130,246,.5);
    }
    .section-head span {
      font-size: .72rem; letter-spacing: 4px;
      color: var(--blue-deep); font-weight: 400;
    }
    .section-head::after {
      content: ''; flex: 1; height: 1px;
      background: linear-gradient(90deg, rgba(59,130,246,.2), transparent);
    }

    /* 阳历/农历切换 */
    .cal-toggle {
      display: inline-flex;
      border: 1px solid var(--blue-pale);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 18px;
      background: var(--blue-ice);
    }
    .cal-btn {
      padding: 7px 22px; cursor: pointer;
      font-size: .82rem; letter-spacing: 2px;
      color: var(--ink3);
      background: transparent;
      transition: all .2s;
      font-family: inherit;
    }
    .cal-btn input[type=radio] { display: none; }
    .cal-btn.active {
      background: linear-gradient(135deg, var(--blue-deep), var(--blue-mid));
      color: #fff;
      border-radius: 6px;
      margin: 2px;
      box-shadow: 0 2px 8px rgba(59,130,246,.35);
    }

    /* 输入行 */
    .field { margin-bottom: 16px; }
    .field label {
      display: block;
      font-size: .72rem; letter-spacing: 2px;
      color: var(--ink3);
      margin-bottom: 7px;
    }
    .label-hint { font-size: .66rem; letter-spacing: 1px; color: var(--blue-soft); }

    .row { display: flex; gap: 10px; }
    .row .field { flex: 1; }

    input[type=number], input[type=text], select {
      width: 100%;
      padding: 10px 13px;
      background: rgba(239,246,255,.7);
      border: 1px solid rgba(147,197,253,.5);
      border-radius: 10px;
      color: var(--ink);
      font-size: .93rem;
      font-family: inherit;
      transition: border-color .22s, background .22s, box-shadow .22s;
      -webkit-appearance: none;
    }
    input:focus, select:focus {
      outline: none;
      border-color: var(--blue-mid);
      background: rgba(255,255,255,.95);
      box-shadow: 0 0 0 3px rgba(59,130,246,.12);
    }
    select option { background: #fff; color: var(--ink); }

    /* 性别 */
    .gender-row { display: flex; gap: 20px; padding-top: 2px; }
    .gender-row label {
      display: flex; align-items: center; gap: 8px;
      cursor: pointer;
      font-size: .9rem; letter-spacing: 1px;
      color: var(--ink2);
      transition: color .18s;
    }
    .gender-row label:hover { color: var(--blue-deep); }
    .gender-row input[type=radio] {
      width: 15px; height: 15px;
      accent-color: var(--blue-deep);
      flex-shrink: 0;
    }

    /* 闰月 */
    .leap-label {
      display: flex; align-items: center; gap: 8px;
      cursor: pointer; color: var(--ink2);
      font-size: .85rem; letter-spacing: 1px;
    }
    .leap-label input { width: 14px; height: 14px; accent-color: var(--blue-deep); }

    /* 地理提示 */
    .geo-hint {
      font-size: .72rem; letter-spacing: 1px;
      color: var(--ink3);
      margin-top: 5px; min-height: 16px;
    }
    .geo-hint.ok  { color: var(--blue-deep); }
    .geo-hint.err { color: #e94560; }

    /* ── 提交按钮 ── */
    .submit {
      width: 100%; margin-top: 22px; padding: 14px;
      background: linear-gradient(135deg, var(--blue-deep) 0%, var(--blue-mid) 100%);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-family: inherit;
      font-size: .92rem; font-weight: 400;
      letter-spacing: 5px;
      cursor: pointer;
      position: relative; overflow: hidden;
      box-shadow: 0 4px 20px rgba(59,130,246,.40);
      transition: all .28s;
    }
    .submit::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.18) 50%, transparent 70%);
      transform: translateX(-100%);
      transition: transform .55s ease;
    }
    .submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(59,130,246,.50);
    }
    .submit:hover::before { transform: translateX(100%); }
    .submit:active { transform: translateY(0px) scale(.99); }

    /* ── 底部功能栏 ── */
    .feat-row {
      display: flex; gap: 0;
      border-top: 1px solid rgba(147,197,253,.25);
      margin-top: 20px; padding-top: 16px;
    }
    .feat {
      flex: 1; text-align: center;
      border-right: 1px solid rgba(147,197,253,.2);
      padding: 4px 2px;
    }
    .feat:last-child { border-right: none; }
    .feat-ico {
      font-size: .9rem; display: block; margin-bottom: 3px;
      color: var(--blue-mid);
    }
    .feat-txt { font-size: .6rem; letter-spacing: 1px; color: var(--ink3); line-height: 1.5; }

    /* ── 动画 ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
<div class="page">

  <!-- 导航 -->
  <nav>
    <a href="index.html" class="active">八字</a>
    <a href="hepan.html">合盘</a>
    <a href="qiming.html">起名</a>
    <a href="zhanbu.html">占卜</a>
    <a href="fengshui.html">风水</a>
  </nav>

  <!-- 品牌区 -->
  <header class="brand-wrap">
    <div class="crystal-wrap">
      <div class="crystal-glow"></div>
      <div class="crystal">
        <!-- 洛书 · 九宫点阵 -->
        <svg class="luoshu-svg" width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
          <!-- 九宫格线 -->
          <line x1="16" y1="2" x2="16" y2="46" stroke="rgba(59,130,246,0.28)" stroke-width="0.6"/>
          <line x1="32" y1="2" x2="32" y2="46" stroke="rgba(59,130,246,0.28)" stroke-width="0.6"/>
          <line x1="2" y1="16" x2="46" y2="16" stroke="rgba(59,130,246,0.28)" stroke-width="0.6"/>
          <line x1="2" y1="32" x2="46" y2="32" stroke="rgba(59,130,246,0.28)" stroke-width="0.6"/>
          <!-- (0,0)=4 阴·蓝 center(8,8) -->
          <circle cx="5.5" cy="5.5" r="1.4" fill="#3b82f6"/>
          <circle cx="10.5" cy="5.5" r="1.4" fill="#3b82f6"/>
          <circle cx="5.5" cy="10.5" r="1.4" fill="#3b82f6"/>
          <circle cx="10.5" cy="10.5" r="1.4" fill="#3b82f6"/>
          <!-- (0,1)=9 阳·白 center(24,8) -->
          <circle cx="21" cy="5"  r="1.4" fill="white"/>
          <circle cx="24" cy="5"  r="1.4" fill="white"/>
          <circle cx="27" cy="5"  r="1.4" fill="white"/>
          <circle cx="21" cy="8"  r="1.4" fill="white"/>
          <circle cx="24" cy="8"  r="1.4" fill="white"/>
          <circle cx="27" cy="8"  r="1.4" fill="white"/>
          <circle cx="21" cy="11" r="1.4" fill="white"/>
          <circle cx="24" cy="11" r="1.4" fill="white"/>
          <circle cx="27" cy="11" r="1.4" fill="white"/>
          <!-- (0,2)=2 阴·蓝 center(40,8) -->
          <circle cx="40" cy="5.5"  r="1.4" fill="#3b82f6"/>
          <circle cx="40" cy="10.5" r="1.4" fill="#3b82f6"/>
          <!-- (1,0)=3 阳·白 center(8,24) -->
          <circle cx="8"   cy="21"  r="1.4" fill="white"/>
          <circle cx="5.5" cy="27"  r="1.4" fill="white"/>
          <circle cx="10.5" cy="27" r="1.4" fill="white"/>
          <!-- (1,1)=5 阳·白 center(24,24) -->
          <circle cx="21.5" cy="21.5" r="1.4" fill="white"/>
          <circle cx="26.5" cy="21.5" r="1.4" fill="white"/>
          <circle cx="24"   cy="24"   r="1.4" fill="white"/>
          <circle cx="21.5" cy="26.5" r="1.4" fill="white"/>
          <circle cx="26.5" cy="26.5" r="1.4" fill="white"/>
          <!-- (1,2)=7 阳·白 center(40,24) -->
          <circle cx="37.5" cy="21" r="1.4" fill="white"/>
          <circle cx="42.5" cy="21" r="1.4" fill="white"/>
          <circle cx="37.5" cy="24" r="1.4" fill="white"/>
          <circle cx="40"   cy="24" r="1.4" fill="white"/>
          <circle cx="42.5" cy="24" r="1.4" fill="white"/>
          <circle cx="37.5" cy="27" r="1.4" fill="white"/>
          <circle cx="42.5" cy="27" r="1.4" fill="white"/>
          <!-- (2,0)=8 阴·蓝 center(8,40) -->
          <circle cx="5.5"  cy="37" r="1.4" fill="#3b82f6"/>
          <circle cx="8"    cy="37" r="1.4" fill="#3b82f6"/>
          <circle cx="10.5" cy="37" r="1.4" fill="#3b82f6"/>
          <circle cx="5.5"  cy="40" r="1.4" fill="#3b82f6"/>
          <circle cx="10.5" cy="40" r="1.4" fill="#3b82f6"/>
          <circle cx="5.5"  cy="43" r="1.4" fill="#3b82f6"/>
          <circle cx="8"    cy="43" r="1.4" fill="#3b82f6"/>
          <circle cx="10.5" cy="43" r="1.4" fill="#3b82f6"/>
          <!-- (2,1)=1 阳·白 center(24,40) -->
          <circle cx="24" cy="40" r="1.4" fill="white"/>
          <!-- (2,2)=6 阴·蓝 center(40,40) -->
          <circle cx="37.5" cy="37" r="1.4" fill="#3b82f6"/>
          <circle cx="42.5" cy="37" r="1.4" fill="#3b82f6"/>
          <circle cx="37.5" cy="40" r="1.4" fill="#3b82f6"/>
          <circle cx="42.5" cy="40" r="1.4" fill="#3b82f6"/>
          <circle cx="37.5" cy="43" r="1.4" fill="#3b82f6"/>
          <circle cx="42.5" cy="43" r="1.4" fill="#3b82f6"/>
        </svg>
      </div>
    </div>
    <div class="crystal-dots">
      <span></span><span></span><span></span>
    </div>

    <p class="lobook-label">洛　書</p>
    <h1 class="brand-name">天机命理</h1>
    <p class="brand-sub">古法推演 · 量身定制</p>

    <p class="tagline">
      千年命学，凝于一盘<br>
      你的<em>专属军师</em>，洞悉天机<br>
      <em>格局</em>定性，<em>流年</em>指路，<em>财库</em>开合
    </p>
  </header>

  <!-- 表单 -->
  <div class="form-wrap">
    <form id="bazi-form">

      <div class="section-head">
        <div class="section-dot"></div>
        <span>填 写 生 辰</span>
      </div>

      <!-- 阳历/农历 -->
      <div class="cal-toggle">
        <label class="cal-btn active" id="lbl-solar">
          <input type="radio" name="caltype" value="solar" checked>阳历
        </label>
        <label class="cal-btn" id="lbl-lunar">
          <input type="radio" name="caltype" value="lunar">农历
        </label>
      </div>

      <div class="field">
        <label>出 生 年 份</label>
        <input type="number" id="year" min="1900" max="2100" placeholder="例：1990" required>
      </div>

      <div class="row">
        <div class="field">
          <label>月</label>
          <select id="month" required>
            <option value="">— 月 —</option>
            <option value="1">一月</option><option value="2">二月</option>
            <option value="3">三月</option><option value="4">四月</option>
            <option value="5">五月</option><option value="6">六月</option>
            <option value="7">七月</option><option value="8">八月</option>
            <option value="9">九月</option><option value="10">十月</option>
            <option value="11">十一月</option><option value="12">十二月</option>
          </select>
        </div>
        <div class="field">
          <label>日</label>
          <input type="number" id="day" min="1" max="31" placeholder="— 日 —" required>
        </div>
        <div class="field">
          <label>时 辰</label>
          <select id="hour" required>
            <option value="">— 时 —</option>
            <option value="23">子  23—01</option>
            <option value="1"> 丑  01—03</option>
            <option value="3"> 寅  03—05</option>
            <option value="5"> 卯  05—07</option>
            <option value="7"> 辰  07—09</option>
            <option value="9"> 巳  09—11</option>
            <option value="11">午  11—13</option>
            <option value="13">未  13—15</option>
            <option value="15">申  15—17</option>
            <option value="17">酉  17—19</option>
            <option value="19">戌  19—21</option>
            <option value="21">亥  21—23</option>
          </select>
        </div>
      </div>

      <!-- 农历闰月 -->
      <div class="field" id="leap-group" style="display:none">
        <label class="leap-label">
          <input type="checkbox" id="is-leap">闰月
        </label>
      </div>

      <!-- 性别 -->
      <div class="field">
        <label>性 别</label>
        <div class="gender-row">
          <label><input type="radio" name="gender" value="男" required>男命</label>
          <label><input type="radio" name="gender" value="女">女命</label>
        </div>
      </div>

      <!-- 出生地 -->
      <div class="field">
        <label>出 生 地 <span class="label-hint">· 可选，用于真太阳时校正</span></label>
        <input type="text" id="birthplace" placeholder="北京 / 上海 / 广州 / 纽约" autocomplete="off">
        <div class="geo-hint" id="geo-hint"></div>
      </div>

      <button type="submit" class="submit">排 盘 解 读</button>

      <!-- 功能提示 -->
      <div class="feat-row">
        <div class="feat"><span class="feat-ico">☯</span><span class="feat-txt">格局<br>定命</span></div>
        <div class="feat"><span class="feat-ico">✦</span><span class="feat-txt">神煞<br>精析</span></div>
        <div class="feat"><span class="feat-ico">◎</span><span class="feat-txt">流年<br>预测</span></div>
        <div class="feat"><span class="feat-ico">⊕</span><span class="feat-txt">财库<br>分析</span></div>
        <div class="feat"><span class="feat-ico">⟐</span><span class="feat-txt">感情<br>婚姻</span></div>
      </div>

    </form>
  </div>

</div>
